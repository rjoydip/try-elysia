name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  BUN_INSTALL_CACHE_DIR: ~/.bun-install-cache

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@3d267786b128fe76c2f16a390aa2448b815359f3 # v2.1.2
        with:
          bun-version-file: package.json

      - name: Cache bun dependencies
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ${{ env.BUN_INSTALL_CACHE_DIR }}
          key: ${{ runner.os }}-bun-deps-${{ hashFiles('**/bun.lockb') }}
          restore-keys: |
            ${{ runner.os }}-bun-deps-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run quality checks
        run: |
          bun run lint
          bun run typecheck
          bun test

      - name: Build Bun binary
        run: bun run build:bun

      - name: Create production release
        uses: changesets/action@v1
        with:
          publish: bun run release
          commit-message: "chore: release version ${ changeset_changes_sha }"
          title: "chore: release version ${ changeset_changes_sha }"
          createGitHubReleases: true
          setupGitHubForNPM: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

name: Nightly Build

on:
  schedule:
    # - cron: "0 0 * * *" # PAUSED
  workflow_dispatch:
    inputs:
      skip_tests:
        description: "Skip quality checks and tests"
        required: false
        default: "false"
        type: boolean
      description:
        description: "Build description or notes"
        required: false
        default: ""
        type: string

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: true

env:
  BUN_INSTALL_CACHE_DIR: ~/.bun-install-cache

jobs:
  nightly-build:
    name: Nightly Dev Build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Cache bun dependencies
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: ${{ env.BUN_INSTALL_CACHE_DIR }}
          key: ${{ runner.os }}-bun-deps-nightly-${{ hashFiles('**/bun.lockb') }}
          restore-keys: |
            ${{ runner.os }}-bun-deps-nightly-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run quality checks
        if: ${{ github.event.inputs.skip_tests != 'true' }}
        run: |
          bun run lint
          bun run typecheck
          bun test

      - name: Get version info
        id: version
        run: |
          DATE=$(date +'%Y%m%d')
          COMMIT=$(git rev-parse --short HEAD)
          COMMIT_COUNT=$(git rev-list --count HEAD)
          echo "date=$DATE" >> $GITHUB_OUTPUT
          echo "commit=$COMMIT" >> $GITHUB_OUTPUT
          echo "count=$COMMIT_COUNT" >> $GITHUB_OUTPUT
          echo "version=0.0.0-dev.$DATE.$COMMIT_COUNT" >> $GITHUB_OUTPUT

      - name: Build Bun binary
        run: |
          bun run build:bun
          mv server "server-${{ env.BUILD_TYPE }}-${{ steps.version.outputs.version }}"

      - name: Generate build info
        id: build_info
        run: |
          cat > build-info.json << 'EOF'
          {
            "build_type": "nightly-dev",
            "version": "${{ steps.version.outputs.version }}",
            "commit": "${{ steps.version.outputs.commit }}",
            "build_date": "${{ steps.version.outputs.date }}",
            "description": "${{ github.event.inputs.description || 'Nightly development build' }}",
            "build_url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          }
          EOF
          echo "info=$(cat build-info.json)" >> $GITHUB_OUTPUT

      - name: Create or update dev release
        uses: softprops/action-gh-release@153bb8e04406b158c6c84fc1615b65b24149a1fe # v2.6.1
        with:
          tag_name: nightly-dev
          name: "Nightly Dev ${{ steps.version.outputs.date }}"
          body: |
            ## Nightly Development Build

            **Version:** `{{ steps.version.outputs.version }}`
            **Commit:** `${{ steps.version.outputs.commit }}`
            **Build Date:** `${{ steps.version.outputs.date }}`

            ${{ github.event.inputs.description || 'Automated nightly development build.' }}

            ### Build Info
            ```json
            ${{ steps.build_info.outputs.info }}
            ```

            ### ⚠️ Warning
            This is a development build and should not be used in production.
            Binaries may be unstable and are subject to change.

            ### Installation
            Download the binary below and make it executable:
            ```bash
            chmod +x <binary-name>
            ./<binary-name>
            ```
          files: |
            server-nightly-dev-${{ steps.version.outputs.version }}
            build-info.json
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload build artifact
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: nightly-dev-${{ steps.version.outputs.version }}
          path: |
            server-nightly-dev-${{ steps.version.outputs.version }}
            build-info.json
          retention-days: 7

      - name: Cleanup old nightly releases
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: |
            const { owner, repo } = context.repo;
            const releases = await github.rest.repos.listReleases({ owner, repo, per_page: 100 });

            const nightlyReleases = releases.data.filter(r => 
              r.tag_name.startsWith('nightly') && !r.draft
            );

            const toDelete = nightlyReleases.slice(7);

            for (const release of toDelete) {
              console.log(`Deleting old release: ${release.tag_name}`);
              await github.rest.repos.deleteRelease({ owner, repo, release_id: release.id });
              
              try {
                await github.rest.git.deleteRef({ owner, repo, ref: `tags/${release.tag_name}` });
              } catch (e) {
                console.log(`Could not delete tag: ${release.tag_name}`);
              }
            }
